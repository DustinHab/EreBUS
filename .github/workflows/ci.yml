name: ci

# Build the loader and kernel, prove the build is reproducible, and boot
# the image once under emulation to confirm the self-tests pass and the
# kernel reaches idle. GitHub's runners have no nested KVM, so the boot
# runs under TCG; the full 37-test battery needs KVM and is run before a
# release on a machine that has it (tools/battery.sh).

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git describe wants the tags

      - name: Install the toolchain
        run: |
          # A stale third-party repo (Google Chrome) on the runner image
          # can make update fail on a hash mismatch; the Ubuntu lists we
          # need still refresh, so do not let that sink the job.
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends \
            clang lld nasm make mtools dosfstools unifont python3-pil \
            qemu-system-x86 ovmf

      - name: Build
        run: |
          touch kernel/gfx/font8x16.h   # use the committed font, do not regenerate
          make
          ls -l build/kernel.elf build/BOOTX64.EFI
          sha256sum build/kernel.elf build/BOOTX64.EFI

      - name: Reproducible build
        run: sh tools/reproduce.sh

      - name: Boot smoke (TCG)
        run: LIMIT=600 sh tools/bootsmoke.sh

      - name: Upload the kernel and the serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/kernel.elf
            build/BOOTX64.EFI
            build/smoke-serial.log
          if-no-files-found: ignore

  # Build every parser fuzzer and run each briefly under ASan and UBSan.
  # This does not need KVM. Its first job is to keep the harnesses from
  # rotting (a fuzzer that stops linking catches no bugs); its second is a
  # short regression run against the seed corpus. A UBSan runtime error
  # does not abort the process and run.sh returns zero regardless, so the
  # output is scanned for any sanitizer report.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the toolchain
        run: |
          # A stale third-party repo (Google Chrome) on the runner image
          # can make update fail on a hash mismatch; the Ubuntu lists we
          # need still refresh, so do not let that sink the job.
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends \
            clang lld make python3-pil openssl

      - name: Build and smoke-fuzz the parsers
        run: |
          touch kernel/gfx/font8x16.h
          sh tools/fuzz/run.sh 25 2>&1 | tee fuzz.log
          if grep -Eq 'runtime error|ERROR: |SUMMARY: |deadly signal|does not build|crash-' fuzz.log; then
            echo "a fuzzer failed to build or reported a fault"; exit 1
          fi

      - name: Upload the fuzz log and any crash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-output
          path: |
            fuzz.log
            build/fuzz/*/crashes
          if-no-files-found: ignore
